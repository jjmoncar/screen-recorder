<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grabador de Pantalla Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="page-layout">
    <!-- Espacio lateral izquierdo para anuncios protegidos y aislados -->
    <aside class="ad-sidebar" aria-label="Espacio publicitario">
      <div class="ad-card">
        <span class="ad-label">Publicidad</span>
        <div class="ad-content">
          <iframe
            srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset='utf-8'&gt;&lt;style&gt;html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:transparent;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;script&gt;atOptions={'key':'c44c768779760e29acebbbcfcafb7ad1','format':'iframe','height':250,'width':300,'params':{}};&lt;/script&gt;&lt;script src='https://www.highrevenueformat.com/c44c768779760e29acebbbcfcafb7ad1/invoke.js'&gt;&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"
            width="300"
            height="250"
            frameborder="0"
            scrolling="no"
            sandbox="allow-scripts"
            loading="lazy"
            title="Publicidad 1"
          ></iframe>
        </div>
      </div>

      <div class="ad-card">
        <span class="ad-label">Publicidad</span>
        <div class="ad-content">
          <iframe
            srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset='utf-8'&gt;&lt;style&gt;html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:transparent;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;script&gt;atOptions={'key':'c44c768779760e29acebbbcfcafb7ad1','format':'iframe','height':250,'width':300,'params':{}};&lt;/script&gt;&lt;script src='https://www.highrevenueformat.com/c44c768779760e29acebbbcfcafb7ad1/invoke.js'&gt;&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"
            width="300"
            height="250"
            frameborder="0"
            scrolling="no"
            sandbox="allow-scripts"
            loading="lazy"
            title="Publicidad 2"
          ></iframe>
        </div>
      </div>
    </aside>

    <main class="app">
      <header class="app-header">
        <div class="logo-title">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 44 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="32" height="32" rx="9" fill="#1ec5d8" />
              <path d="M32 11L42 5V27L32 21V11Z" fill="#16abbc" />
              <circle cx="16" cy="16" r="8" fill="#ffffff" />
              <circle cx="16" cy="16" r="5.5" fill="#ff4757" />
            </svg>
          </div>
          <h1>Grabador de Pantalla Online Gratis</h1>
        </div>
        <p class="lede">¡Un clic para empezar tus grabaciones ilimitadas!</p>
      </header>

      <section class="modes" aria-label="Modo de captura">
        <label class="mode-card">
          <input type="radio" name="mode" value="fullscreen" checked />
          <span class="mode-content">
            <span class="mode-icon">🖥️</span>
            <span>
              <strong>Pantalla completa</strong>
              <small>Graba todo el monitor</small>
            </span>
          </span>
        </label>
        <label class="mode-card">
          <input type="radio" name="mode" value="window" />
          <span class="mode-content">
            <span class="mode-icon">🌐</span>
            <span>
              <strong>Navegador</strong>
              <small>Graba la ventana y todas sus pestañas</small>
            </span>
          </span>
        </label>
      </section>

      <div class="controls">
        <button id="start" type="button" class="btn-start">
          <span class="btn-rec-dot"></span>
          <span>Empezar a grabar</span>
        </button>
        <button id="stop" type="button" class="btn-stop" disabled>
          <span class="btn-stop-icon">■</span>
          <span>Detener</span>
        </button>
        <div class="status-wrapper">
          <span class="status-indicator"></span>
          <p id="status" role="status">Listo</p>
        </div>
      </div>

      <div class="hint-box">
        <span class="hint-icon">💡</span>
        <span id="mode-hint">Modo <strong>Pantalla completa</strong>: capturará todo lo que se vea en el monitor seleccionado.</span>
      </div>

      <div class="stage">
        <video id="preview" autoplay muted playsinline></video>
        <div id="countdown-overlay" class="countdown-overlay" hidden>
          <div class="countdown-circle">
            <svg class="countdown-svg" viewBox="0 0 100 100">
              <circle class="countdown-bg-ring" cx="50" cy="50" r="44" />
              <circle id="countdown-progress-ring" class="countdown-progress-ring" cx="50" cy="50" r="44" />
            </svg>
            <div id="countdown-number" class="countdown-number">5</div>
          </div>
          <div id="countdown-text" class="countdown-text">Iniciando en 5 segundos...</div>
        </div>
        <p id="live-badge" class="live" hidden>
          <span class="live-dot"></span> REC
        </p>
      </div>

      <a id="download" hidden>Descargar última grabación</a>

      <section class="library">
        <h2>Grabaciones guardadas</h2>
        <ul id="recordings"></ul>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
