<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grabador de pantalla</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Grabador de pantalla</h1>
      <p class="lede">Elige un modo, pulsa Grabar y concede el permiso de captura en el navegador.</p>
    </header>

    <section class="modes" aria-label="Modo de captura">
      <label class="mode-card">
        <input type="radio" name="mode" value="fullscreen" checked />
        <span>
          <strong>Pantalla completa</strong>
          <small>Graba todo el monitor</small>
        </span>
      </label>
      <label class="mode-card">
        <input type="radio" name="mode" value="window" />
        <span>
          <strong>Navegador</strong>
          <small>Graba la ventana y todas sus pestañas</small>
        </span>
      </label>
    </section>

    <div class="controls">
      <button id="start" type="button">Grabar</button>
      <button id="stop" type="button" disabled>Detener</button>
      <p id="status" role="status">Listo</p>
    </div>

    <div class="hint-box">
      <span class="hint-icon">💡</span>
      <span id="mode-hint">Modo <strong>Pantalla completa</strong>: capturará todo lo que se vea en el monitor seleccionado.</span>
    </div>

    <div class="stage">
      <video id="preview" autoplay muted playsinline></video>
    </div>

    <p id="live-badge" class="live" hidden>REC</p>
    <a id="download" hidden>Descargar última grabación</a>

    <section class="library">
      <h2>Grabaciones guardadas</h2>
      <ul id="recordings"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
